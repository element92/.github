name: "Bug Report"
description: "Something is broken. Use this instead of Agent-Ready Task when reporting a defect in existing behavior rather than requesting new work."
title: "[Bug]: "
labels: ["bug", "agent-ready"]
body:
  - type: markdown
    attributes:
      value: |
        A good bug report gives an agent (or a human) everything needed to reproduce the problem without asking you follow-up questions. If you can't reliably reproduce it, say so explicitly rather than guessing at steps.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what's broken.
      placeholder: "e.g. The Ruddr sync script silently drops time entries logged on weekends."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Numbered steps, starting from a clean state. Include exact input data if relevant (or a path to a sample file).
      placeholder: |
        1. Run `python sync.py --date 2026-07-25` (a Saturday)
        2. Check the output log
        3. Compare entry count to Ruddr's dashboard for that date
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? Paste exact error messages, stack traces, or log output — don't paraphrase them.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, tool/script version, branch or commit hash, and anything else that distinguishes your setup.
      placeholder: |
        macOS 15.4, Python 3.12, branch: main @ commit abc1234
    validations:
      required: false

  - type: textarea
    id: relevant_files
    attributes:
      label: Relevant Files & Paths
      description: Which files or modules are involved, if known. If unsure, list keywords to search for (function names, error strings).
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope / Do Not Touch
      description: Anything the agent must not modify while fixing this — other modules, config, CI/CD, production settings.
      placeholder: |
        - Do not modify anything under /infra or .github/workflows
        - Fix only the date-parsing logic, do not refactor the sync loop
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How to Verify the Fix
      description: Exact commands/checks that should pass once this is fixed.
    validations:
      required: true

  - type: dropdown
    id: touches_secrets
    attributes:
      label: Does this involve credentials, API keys, or external services?
      options:
        - "No"
        - "Yes — details in Additional Notes"
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: Risk Level
      options:
        - "Low — isolated change, easy to review"
        - "Medium — touches shared code or multiple files"
        - "High — touches production config, CI/CD, auth, billing, or infra"
    validations:
      required: true

  - type: checkboxes
    id: review_requirements
    attributes:
      label: Review & Safety Requirements
      options:
        - label: A human will review and approve the PR before merge
          required: true

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Anything else — when this started happening, whether it's a regression, related past issues.
    validations:
      required: false
